<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤖 AI Assistant</title>
  <meta name="description"
    content="Advanced AI assistant with chat, image generation, and intelligent image analysis capabilities" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-900 text-slate-200 flex flex-col h-screen font-sans">
  <!-- Header -->
  <header class="flex justify-center py-3 border-b border-slate-600 font-semibold text-gray-300">
    🤖 OpenAI
  </header>

  <!-- Chat Area -->
  <div id="chat" class="flex-1 overflow-y-auto flex justify-center" role="log" aria-live="polite"
    aria-label="Chat messages">
    <div id="chatInner" class="w-full max-w-3xl px-5 py-6"></div>
  </div>

  <!-- Input Box -->
  <div class="flex justify-center">
    <div class="w-full max-w-3xl p-4">
      <div
        class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-full px-4 py-2 ring-1 ring-slate-700 focus-within:ring-1 focus-within:ring-slate-400 transition">
        <textarea id="input" placeholder="Ask anything…" rows="1"
          class="flex-1 resize-none bg-transparent text-gray-200 placeholder:text-gray-500 focus:outline-none leading-6 py-2 max-h-40"
          oninput="toggleButtons()" aria-label="Chat message input"></textarea>

        <button id="sendBtn" onclick="send()" disabled
          class="shrink-0 w-9 h-9 rounded-full bg-white transition flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-300"
          aria-label="Send message" title="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-black" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-6 6m6-6l6 6" />
          </svg>
        </button>

        <button id="imageBtn" onclick="generateImage()" disabled
          class="shrink-0 w-9 h-9 rounded-full border border-gray-600 text-gray-400 hover:text-gray-300 hover:border-gray-500 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition"
          aria-label="Generate image" title="Generate image from prompt">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </button>

        <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload()" />

        <button id="uploadBtn" onclick="document.getElementById('imageUpload').click()" class="shrink-0 w-9 h-9 rounded-full 
               border border-slate-600 
               text-slate-400 
               hover:text-slate-200 hover:border-slate-400 
               active:scale-95
               transition-all duration-150
               flex items-center justify-center
               disabled:opacity-30 disabled:cursor-not-allowed
               disabled:hover:border-slate-600 disabled:hover:text-slate-400" title="Upload image for analysis">

          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 7h4l2-2h6l2 2h4v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11a3 3 0 100 6 3 3 0 000-6z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chatInner");
    const chatOuter = document.getElementById("chat");

    let wordQueue = [];
    let typingInterval = null;
    let streamFinished = false;

    function addMessage(text, cls) {
      const row = document.createElement("div");
      row.className = "flex w-full";
      const div = document.createElement("div");
      div.className =
        "inline-block max-w-[75%] px-4 py-3 mb-5 rounded-2xl leading-relaxed whitespace-pre-wrap text-white ml-auto " +
        (cls === "user" ? "bg-gray-800" : "bg-slate-950 border border-slate-700");
      div.textContent = text;
      row.appendChild(div);
      chat.appendChild(row);
      chatOuter.scrollTop = chatOuter.scrollHeight;
    }

    function send() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      toggleButtons();

      streamFinished = false;
      wordQueue = [];
      clearInterval(typingInterval);
      typingInterval = null;

      const aiMsg = document.createElement("div");
      aiMsg.className = "max-w-[75%] px-4 py-3 mb-5 rounded-xl leading-relaxed bg-slate-950 border border-slate-700";
      aiMsg.innerHTML = `<span class="content text-white"></span><span class="inline-block w-3 h-3 rounded-full bg-slate-200 ml-1 animate-pulse"></span>`;
      chat.appendChild(aiMsg);
      chatOuter.scrollTop = chatOuter.scrollHeight;

      const contentSpan = aiMsg.querySelector(".content");

      setTimeout(() => {
        fetch("http://localhost:7070/api/chatGPT", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "TB", task: { type: "TB", sub_type: "summarizer.max_words", user_input: text } })
        }).then(res => {
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          readStream(reader, decoder);
          startTyping(contentSpan);
        });
      }, 500);
    }

    function readStream(reader, decoder) {
      reader.read().then(({ done, value }) => {
        if (done) return;
        const chunk = decoder.decode(value, { stream: true });
        chunk.split("\n\n").forEach(line => {
          if (line.startsWith("data: ")) {
            const data = line.replace("data: ", "");
            if (data === "[DONE]") { streamFinished = true; return; }
            try {
              const json = JSON.parse(data);
              if (json.type === "final") return;
            } catch {
              data.replace(/\r\n/g, "\n").split(/(\n|(?<=\. )|(?<=\! )|(?<=\? ))/).forEach(part => {
                if (part !== "") wordQueue.push(part);
              });
            }
          }
        });
        readStream(reader, decoder);
      });
    }

    function startTyping(contentSpan) {
      if (typingInterval) return;
      typingInterval = setInterval(() => {
        if (wordQueue.length === 0) {
          if (streamFinished) {
            const cursor = contentSpan.parentElement.querySelector(".animate-pulse");
            if (cursor) cursor.remove();
            clearInterval(typingInterval);
            typingInterval = null;
          }
          return;
        }
        const next = wordQueue.shift();
        contentSpan.innerHTML += next === "\n" ? "<br/>" : next;
        chatOuter.scrollTop = chatOuter.scrollHeight;
      }, 50);
    }

    async function generateImage() {
      const input = document.getElementById("input");
      const prompt = input.value.trim();
      if (!prompt) return alert("Type something first!");
      input.value = "";
      input.disabled = true;
      toggleButtons();

      const container = document.createElement("div");
      container.className = "flex flex-col w-full mb-5";
      chat.appendChild(container);
      chatOuter.scrollTop = chatOuter.scrollHeight;

      const userMsg = document.createElement("div");
      userMsg.className = "flex w-full justify-end";
      const userDiv = document.createElement("div");
      userDiv.className = "inline-block max-w-[75%] px-4 py-3 mb-2 rounded-2xl bg-gray-800 text-white";
      userDiv.textContent = prompt;
      userMsg.appendChild(userDiv);
      container.appendChild(userMsg);
      chatOuter.scrollTop = chatOuter.scrollHeight;

      const aiMsg = document.createElement("div");
      aiMsg.className = "flex w-full justify-start mt-2";
      const aiDiv = document.createElement("div");
      aiDiv.className = "inline-block max-w-[75%] px-4 py-3 rounded-xl bg-slate-950 text-white";

      aiDiv.innerHTML = `
    <div class="relative mt-2 rounded-lg bg-gradient-to-r from-gray-700 via-gray-600 to-gray-700 p-4 shadow-lg border border-gray-600 animate-pulse"
         style="width: 400px; height: 400px; max-width: 100%; aspect-ratio: 1;">
      <div class="flex items-center justify-center h-full text-gray-400">
        <div class="text-center">
          <div class="animate-bounce mb-2">🎨</div>
          <div class="text-sm font-medium mb-1">Creating image...</div>
          <div class="mt-2 flex space-x-1 justify-center">
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
          </div>
        </div>
      </div>
    </div>
  `;
      aiMsg.appendChild(aiDiv);
      container.appendChild(aiMsg);
      chatOuter.scrollTop = chatOuter.scrollHeight;

      try {
        const res = await fetch("http://localhost:7070/api/imageGenerate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();

        if (data.success) {
          const img = document.createElement("img");
          img.src = data.url;
          img.className = "rounded-lg shadow-lg border border-gray-600 opacity-0 transition-opacity duration-500";

          img.style.width = "400px";
          img.style.height = "400px";
          img.style.maxWidth = "100%";
          img.style.objectFit = "cover";

          img.onload = () => {
            aiDiv.innerHTML = "";
            aiDiv.appendChild(img);
            img.classList.remove("opacity-0");
            input.disabled = false;
            toggleButtons();
          };
        } else {
          aiDiv.innerHTML = `<div class="text-red-400 mt-2">❌ Error generating image</div>`;
          input.disabled = false;
          toggleButtons();
        }
      } catch (err) {
        aiDiv.innerHTML = `<div class="text-red-400 mt-2">❌ Error: ${err.message}</div>`;
        input.disabled = false;
        toggleButtons();
      }
    }

    async function handleImageUpload() {
      const fileInput = document.getElementById("imageUpload");
      const file = fileInput.files[0];
      if (!file) return;

      const container = document.createElement("div");
      container.className = "flex flex-col w-full mb-5";
      chat.appendChild(container);
      chatOuter.scrollTop = chatOuter.scrollHeight;

      const reader = new FileReader();
      reader.onload = () => {
        const userMsg = document.createElement("div");
        userMsg.className = "flex w-full justify-end";
        const div = document.createElement("div");
        div.className =
          "inline-block max-w-[75%] px-4 py-3 rounded-2xl leading-relaxed text-white bg-gray-800";
        div.innerHTML = `<div class="text-sm text-gray-300 mb-2">📸 You uploaded an image</div>
                     <img src="${reader.result}" class="max-w-xs rounded-lg border border-slate-600" />`;
        userMsg.appendChild(div);
        container.appendChild(userMsg);
        chatOuter.scrollTop = chatOuter.scrollHeight;

        const aiMsg = document.createElement("div");
        aiMsg.className = "flex w-full justify-start mt-5";
        const aiDiv = document.createElement("div");
        aiDiv.className =
          "inline-block max-w-[75%] px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white flex items-center gap-2";
        aiDiv.innerHTML = `
      <span class="dots flex gap-1">
        <span class="dot w-2 h-2 bg-white rounded-full animate-bounce"></span>
        <span class="dot w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:0.1s"></span>
        <span class="dot w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:0.2s"></span>
      </span>
      <span>🤖 Analyzing image...</span>
    `;
        aiMsg.appendChild(aiDiv);
        container.appendChild(aiMsg);
        chatOuter.scrollTop = chatOuter.scrollHeight;

        const formData = new FormData();
        formData.append("image", file);

        (async () => {
          try {
            const res = await fetch("http://localhost:7070/api/imageToText", {
              method: "POST",
              body: formData,
            });
            const data = await res.json();
            aiDiv.innerHTML = data.text;
            chatOuter.scrollTop = chatOuter.scrollHeight;
          } catch (err) {
            aiDiv.innerHTML = "❌ Error analyzing image";
            chatOuter.scrollTop = chatOuter.scrollHeight;
          }
        })();
      };
      reader.readAsDataURL(file);
      fileInput.value = "";
    }

    function toggleButtons() {
      const input = document.getElementById("input");
      const textBtn = document.getElementById("sendBtn");
      const imgBtn = document.getElementById("imageBtn");
      const uploadBtn = document.getElementById("uploadBtn");

      const hasText = input.value.trim().length > 0;
      const isDisabled = input.disabled;

      textBtn.disabled = !hasText || isDisabled;
      imgBtn.disabled = !hasText || isDisabled;

      uploadBtn.disabled = hasText || isDisabled;
    }

  </script>
</body>

</html>
